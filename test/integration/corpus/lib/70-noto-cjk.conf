<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  70-noto-cjk.conf: the Noto Sans CJK face of each CJK language, ahead of the
  others. fontconfig judges a region's subset font to support another
  region's language when its character set covers that language's
  orthography (Noto Sans SC covers ja and zh-tw), and between fonts that
  support a language alike it falls back on its order of families, which put
  Noto Sans SC ahead of Noto Sans TC for zh-tw. Poppler asks for the language
  of a CJK collection (Adobe-Japan1 ja, Adobe-Korea1 ko, Adobe-GB1 zh-cn,
  Adobe-CNS1 zh-tw) and draws with the first font that supports it, so each
  language names its own region's face first. The bundle's fontconfig reads
  this file through conf.d (bundle-poppler.sh).
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans TC</string></edit>
  </match>
</fontconfig>
