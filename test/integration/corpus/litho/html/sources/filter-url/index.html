<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG filters on HTML</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 11pt; }
h1 { font-size: 16pt; }
.row::after { content: ""; display: block; clear: both; }
.cell { float: left; width: 150px; margin: 0 24px 28px 0; }
.box { height: 80px; background: linear-gradient(135deg, #e63946, #457b9d); }
.cell p { margin: 10px 0 0; font-size: 9pt; }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute">
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="mono"><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="lifted" x="-20%" y="-20%" width="150%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
    <feOffset in="b" dx="5" dy="5" result="o"/>
    <feFlood flood-color="#264653" flood-opacity="0.7"/>
    <feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="posterize" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 0.5 1"/>
      <feFuncG type="discrete" tableValues="0 0.5 1"/>
      <feFuncB type="discrete" tableValues="0 0.5 1"/>
    </feComponentTransfer>
  </filter>
</svg>
<h1>filter: url()</h1>
<div class="row">
<div class="cell"><div class="box" style="filter: url(#soft)"></div><p>a Gaussian blur</p></div>
<div class="cell"><div class="box" style="filter: url(#mono)"></div><p>a colour matrix</p></div>
<div class="cell"><div class="box" style="filter: url(#lifted)"></div><p>a shadow merged under</p></div>
<div class="cell"><div class="box" style="filter: url(#posterize)"></div><p>a component transfer</p></div>
<div class="cell"><div class="box" style="filter: url(#mono) blur(2px)"></div><p>a reference, then a function</p></div>
<div class="cell"><div class="box" style="filter: url(#missing)"></div><p>naming no element</p></div>
</div>
<p>Each box is drawn through the SVG filter element its filter names.</p>
</body>
</html>
