<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook: {{ .Title }}</title>
<style>
@page { size: 420pt 594pt; margin: 36pt 30pt; }
body { font-family: "Liberation Serif", serif; font-size: 11pt; line-height: 1.4; color: #222222; margin: 0; }
.running { font-family: "Liberation Sans", sans-serif; font-size: 8pt; color: #6b6b6b; text-transform: uppercase; letter-spacing: 1pt; margin: 0 0 12pt; }
h1, h2 { font-family: "Liberation Sans", sans-serif; color: #2b3a8c; }
h1 { font-size: 18pt; margin: 0 0 10pt; padding-bottom: 4pt; border-bottom: 2pt solid #2b3a8c; }
h2 { font-size: 13pt; margin: 14pt 0 6pt; }
blockquote { margin: 8pt 0; padding: 2pt 0 2pt 10pt; border-left: 3pt solid #c0392b; color: #555555; font-style: italic; }
table { border-collapse: collapse; margin: 6pt 0; }
th, td { border: 0.75pt solid #999999; padding: 2pt 8pt; }
th { background: #e8eaf6; }
pre { font-family: "Liberation Mono", monospace; font-size: 9pt; background: #f2f2f2; padding: 6pt; }
code { font-family: "Liberation Mono", monospace; }
</style>
</head>
<body>
<p class="running">{{ .Title }}</p>
{{ toHTML }}
</body>
</html>
