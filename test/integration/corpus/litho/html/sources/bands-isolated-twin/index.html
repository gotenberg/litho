<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isolation</title>
<style>
@page {
  size: A5;
  margin: 20mm;
}
@page t1 {
  @top-center { content: "Isolated header, page 1"; width: 100%; text-align: left; font-family: "Liberation Sans", sans-serif; font-size: 9pt; font-weight: normal; line-height: normal; color: black; }
  @bottom-center { content: "Styled footer"; width: 100%; text-align: left; font-family: "Liberation Serif", serif; font-size: 12pt; font-weight: bold; line-height: 1.4; color: #b00020; }
}
@page t2 {
  @top-center { content: "Isolated header, page 2"; width: 100%; text-align: left; font-family: "Liberation Sans", sans-serif; font-size: 9pt; font-weight: normal; line-height: normal; color: black; }
  @bottom-center { content: "Styled footer"; width: 100%; text-align: left; font-family: "Liberation Serif", serif; font-size: 12pt; font-weight: bold; line-height: 1.4; color: #b00020; }
}
body { font-family: "Liberation Serif", serif; font-size: 12pt; line-height: 1.4; margin: 0; color: #333; }
p { font-size: 14pt; }
.t1 { page: t1; } .t2 { page: t2; }
</style>
</head>
<body>
<section class="t1">
<h1>Isolation</h1>
<p>The header is isolated: the document's rules do not reach it, and its own style sheet sets its font. The footer is not: the document's rules colour it and set it in bold.</p>
</section>
<section class="t2">
<h1>Second page</h1>
<p>Both bands repeat on every page, the header with the page number.</p>
</section>
</body>
</html>
