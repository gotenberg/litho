<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ルビ</title>
<style>
body { font-family: "Noto Sans CJK JP", sans-serif; font-size: 12pt; margin: 0; color: #222; }
h1 { font-size: 15pt; font-weight: normal; margin: 0 0 8pt; }
h2 { font-size: 10pt; font-weight: normal; color: #555; margin: 12pt 0 2pt; }
p { margin: 0; line-height: 2.2; text-align: start; }
rt { color: #c33; }
.under ruby { ruby-position: under; }
.big { font-size: 20pt; }
</style>
</head>
<body>
<h1>『世界人権宣言』　第１条</h1>
<h2>グループルビ</h2>
<p>すべての<ruby>人間<rt>にんげん</rt></ruby>は、<ruby>生<rt>う</rt></ruby>まれながらにして<ruby>自由<rt>じゆう</rt></ruby>であり、かつ、<ruby>尊厳<rt>そんげん</rt></ruby>と<ruby>権利<rt>けんり</rt></ruby>とについて<ruby>平等<rt>びょうどう</rt></ruby>である。<ruby>人間<rt>にんげん</rt></ruby>は、<ruby>理性<rt>りせい</rt></ruby>と<ruby>良心<rt>りょうしん</rt></ruby>とを<ruby>授<rt>さず</rt></ruby>けられており、<ruby>互<rt>たが</rt></ruby>いに<ruby>同胞<rt>どうほう</rt></ruby>の<ruby>精神<rt>せいしん</rt></ruby>をもって<ruby>行動<rt>こうどう</rt></ruby>しなければならない。</p>
<h2>モノルビと親文字より長いルビ</h2>
<p class="big"><ruby>人<rt>にん</rt>間<rt>げん</rt></ruby>、<ruby>授<rt>さず</rt></ruby>ける、<ruby>行<rt>こう</rt>動<rt>どう</rt></ruby>、<ruby>人<rt>じん</rt>権<rt>けん</rt></ruby></p>
<h2>ruby-position: under と rp</h2>
<p class="under big"><ruby>世界<rp>（</rp><rt>せかい</rt><rp>）</rp></ruby><ruby>人権<rp>（</rp><rt>じんけん</rt><rp>）</rp></ruby><ruby>宣言<rp>（</rp><rt>せんげん</rt><rp>）</rp></ruby></p>
<h2 lang="zh-Hans">拼音</h2>
<p class="big" lang="zh-Hans" style="font-family: 'Noto Sans CJK SC', sans-serif"><ruby>世界<rt>shìjiè</rt></ruby><ruby>人权<rt>rénquán</rt></ruby><ruby>宣言<rt>xuānyán</rt></ruby></p>
</body>
