<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>縦書き</title>
<style>
html { writing-mode: vertical-rl; }
body { font-family: "Noto Sans CJK JP", sans-serif; font-size: 12pt; margin: 0; color: #222; line-height: 1.8; }
h1 { font-size: 16pt; font-weight: normal; margin: 0 0 0 12pt; }
h2 { font-size: 12pt; font-weight: normal; color: #c33; margin: 0 0 0 6pt; }
p { margin: 0 0 0 6pt; text-align: start; }
.tcy { text-combine-upright: all; }
.upright { text-orientation: upright; }
</style>
</head>
<body>
<h1>『世界人権宣言』</h1>
<p>（<span class="tcy">1948</span>年<span class="tcy">12</span>月<span class="tcy">10</span>日、第<span class="tcy">3</span>回国際連合総会で採択）</p>
<h2>第１条</h2>
<p>すべての人間は、生まれながらにして自由であり、かつ、尊厳と権利とについて平等である。人間は、理性と良心とを授けられており、互いに同胞の精神をもって行動しなければならない。</p>
<h2>第３条</h2>
<p>すべての人は、生命、自由及び身体の安全に対する権利を有する。</p>
<p>英語では UDHR、正立させて <span class="upright">UDHR</span> とも書く。「世界人権宣言」は、全<span class="tcy">30</span>条からなる。</p>
</body>
</html>
