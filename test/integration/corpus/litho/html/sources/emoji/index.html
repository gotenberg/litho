<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emoji</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 12pt; margin: 0; color: #222; }
h1 { font-size: 16pt; margin: 0 0 8pt; }
p { margin: 0 0 6pt; line-height: 1.6; }
.big { font-size: 22pt; }

</style>

<body>
<h1>Emoji in running text</h1>
<p>Article 1 🕊️ All human beings are born free and equal in dignity and rights ⚖️.</p>
<table>
<tr><td>Single code point</td><td class="big">🌍 📜 🗳</td></tr>
<tr><td>ZWJ sequence</td><td class="big">👩‍💻 👨‍👩‍👧</td></tr>
<tr><td>Skin tone modifier</td><td class="big">👍🏽 ✋🏿</td></tr>
<tr><td>Flag sequence</td><td class="big">🇺🇳 🇫🇷 🇯🇵</td></tr>
<tr><td>Keycap sequence</td><td class="big">1️⃣ 3️⃣ 0️⃣</td></tr>
<tr><td>Text and emoji presentation</td><td class="big">❤︎ ❤️ ☺︎ ☺️</td></tr>
</table>

</html>
