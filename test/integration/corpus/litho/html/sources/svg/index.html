<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 12pt; }
.tiles { width: 400px; height: 120px; border: 1px solid #000; background: url("pattern.svg") repeat; }
figure { margin: 0 0 16px; }
</style>
</head>
<body>
<h1>SVG</h1>
<p>INLINE-MARKER An inline svg element: shapes, a path, a radial and a linear gradient, a transformed group and text.</p>
<figure>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
  <defs>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e63946"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="0.5" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="480" height="200" fill="#ffffff" stroke="#000000"/>
  <rect x="10" y="10" width="120" height="80" fill="url(#lg)"/>
  <circle cx="200" cy="50" r="40" fill="url(#rg)" stroke="#1d3557" stroke-width="3"/>
  <ellipse cx="320" cy="50" rx="60" ry="30" fill="#457b9d" opacity="0.7"/>
  <line x1="10" y1="110" x2="470" y2="110" stroke="#000000" stroke-dasharray="8 4" stroke-width="2"/>
  <polyline points="10,190 60,130 110,170 160,120 210,180" fill="none" stroke="#e76f51" stroke-width="3"/>
  <polygon points="260,190 300,120 340,190" fill="#264653"/>
  <path d="M360 190 C 380 120, 440 120, 460 190 Z" fill="#a8dadc" stroke="#1d3557"/>
  <g transform="translate(420 40) rotate(30)">
    <rect x="-20" y="-20" width="40" height="40" fill="#e9c46a" stroke="#000"/>
  </g>
  <text x="240" y="150" font-family="Liberation Serif, serif" font-size="20" text-anchor="middle" fill="#000000">SVG-TEXT-MARKER</text>
</svg>
</figure>
<p>IMG-MARKER The same kinds of shapes from an img element naming an SVG file:</p>
<figure><img src="badge.svg" alt="badge"> <img src="badge.svg" alt="badge, half size" width="80" height="50"></figure>
<p>BACKGROUND-MARKER An SVG file as a tiled CSS background:</p>
<div class="tiles"></div>
</body>
</html>
