<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVG masks</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 11pt; }
h1 { font-size: 16pt; }
.row::after { content: ""; display: block; clear: both; }
.cell { float: left; width: 150px; height: 110px; margin: 0 16px 16px 0; position: relative; }
.cell p { margin: 4px; }
.m { float: left; width: 150px; height: 100px; margin: 0 16px 16px 0; padding: 6px; box-sizing: border-box; background: #264653; color: white; }
</style>
</head>
<body>
<h1>Masks in SVG and from SVG</h1>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<linearGradient id="fade"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="lum" maskUnits="userSpaceOnUse" x="0" y="0" width="150" height="100"><rect width="150" height="100" fill="url(#fade)"/></mask>
<mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="150" height="100"><circle cx="75" cy="50" r="45" fill="black"/></mask>
</svg>
<div class="row">
<div class="m" style="mask:url(#lum)">Luminance mask</div>
<div class="m" style="mask:url(#alpha)">Alpha mask</div>
</div>
<svg width="460" height="130" viewBox="0 0 460 130">
<title>A masked rectangle, a rectangle with a hole, blending and group opacity</title>
<defs>
<linearGradient id="ramp"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="in"><rect x="0" y="0" width="140" height="120" fill="url(#ramp)"/></mask>
<mask id="hole" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="white"/><circle cx="0.5" cy="0.5" r="0.3" fill="black"/></mask>
</defs>
<rect x="0" y="0" width="140" height="120" fill="#e9c46a" mask="url(#in)"/>
<text x="10" y="70" font-family="Liberation Sans" font-size="20">Masked</text>
<g mask="url(#hole)"><rect x="160" y="0" width="140" height="120" fill="#2a9d8f"/></g>
<rect x="320" y="0" width="140" height="120" fill="#e9c46a"/>
<g style="isolation:isolate"><rect x="340" y="20" width="60" height="80" fill="#e76f51" style="mix-blend-mode:multiply"/></g>
<rect x="400" y="20" width="50" height="80" fill="#2a9d8f" style="mix-blend-mode:multiply"/>
<g opacity="0.5"><circle cx="350" cy="110" r="15" fill="#d62828"/><circle cx="365" cy="110" r="15" fill="#1d3557"/></g>
</svg>
<p>An HTML box masked by an SVG mask element by luminance and by alpha; in an SVG drawing, masks, blending, isolation and group opacity.</p>
</body>
</html>
