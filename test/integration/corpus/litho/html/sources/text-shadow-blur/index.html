<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blurred text shadows</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 11pt; color: #1d3557; }
h1 { font-size: 16pt; }
.big { font-size: 28pt; font-weight: bold; margin: 0 0 18px; }
</style>
</head>
<body>
<h1>text-shadow with a blur radius</h1>
<p class="big" style="text-shadow: 3px 3px 2px rgba(0,0,0,0.5)">Soft shadow</p>
<p class="big" style="text-shadow: 4px 4px 8px #e63946">Wide red shadow</p>
<p class="big" style="color: #f1faee; text-shadow: 0 0 6px #457b9d, 0 0 12px #1d3557">Glow</p>
<p class="big" style="text-decoration: underline; text-shadow: 2px 3px 3px #2a9d8f">Underlined</p>
<p class="big" style="text-shadow: 3px 3px 0 #e9c46a, 6px 6px 6px #264653">Sharp then soft</p>
<p style="font-size: 14pt; text-shadow: 1px 1px 1px #888">A line of body text with a light one pixel blur on its shadow, long enough to wrap onto a second line of the paragraph.</p>
</body>
</html>
