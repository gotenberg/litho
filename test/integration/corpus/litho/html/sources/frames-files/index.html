<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frames of files</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 10pt; }
iframe { border: 1px solid #264653; }
td { border: 1px solid #999; padding: 4px; vertical-align: top; }
</style>
</head>
<body>
<h1>Frames of files</h1>
<p>A picture framed: <iframe src="badge.png" title="The office badge" width="200" height="100"></iframe> in this paragraph.</p>
<p>A text file framed, its markup shown as text:</p>
<iframe src="notes.txt" title="Opening hours" width="420" height="120"></iframe>
<p>A picture as an object, stretched over its box: <object data="badge.png" title="The badge stretched" width="120" height="40">The badge</object></p>
<table><tr><td>A guide in a cell, its links inside the frame:<br><iframe src="guide.html" title="Guide" width="360" height="90"></iframe></td><td>The cell beside it.</td></tr></table>
<p>The text after the frames.</p>
</body>
</html>
