<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Borders and radii</title>
<style>
body { font-family: "Liberation Sans", sans-serif; font-size: 10pt; }
.grid::after { content: ""; display: block; clear: both; }
.cell { float: left; width: 150px; height: 70px; margin: 0 14px 14px 0; padding: 6px; }
.solid { border: 4px solid #264653; }
.dashed { border: 4px dashed #2a9d8f; }
.dotted { border: 4px dotted #e76f51; }
.double { border: 6px double #264653; }
.groove { border: 8px groove #8d99ae; }
.ridge { border: 8px ridge #8d99ae; }
.inset { border: 8px inset #8d99ae; }
.outset { border: 8px outset #8d99ae; }
.sides { border-top: 2px solid red; border-right: 6px solid green; border-bottom: 10px solid blue; border-left: 14px solid orange; }
.r-all { border: 3px solid #333; border-radius: 16px; }
.r-pill { border: 3px solid #333; border-radius: 40px; }
.r-mixed { border: 3px solid #333; border-radius: 0 24px 8px 40px; }
.r-ellipse { border: 3px solid #333; border-radius: 50% / 30%; }
.r-thick { border: 12px solid #e9c46a; border-radius: 24px; }
.r-sides { border-style: solid; border-width: 2px 8px 14px 4px; border-color: #e63946 #457b9d #2a9d8f #f4a261; border-radius: 20px; }
.r-fill { background: #a8dadc; border-radius: 12px 36px; }
</style>
</head>
<body>
<h1>Borders and radii</h1>
<h2>Styles</h2>
<div class="grid">
  <div class="cell solid">solid BORDER-MARKER</div>
  <div class="cell dashed">dashed</div>
  <div class="cell dotted">dotted</div>
  <div class="cell double">double</div>
  <div class="cell groove">groove</div>
  <div class="cell ridge">ridge</div>
  <div class="cell inset">inset</div>
  <div class="cell outset">outset</div>
  <div class="cell sides">four widths and colours</div>
</div>
<h2>Radii</h2>
<div class="grid">
  <div class="cell r-all">16px on every corner RADIUS-MARKER</div>
  <div class="cell r-pill">pill</div>
  <div class="cell r-mixed">mixed corners</div>
  <div class="cell r-ellipse">elliptical</div>
  <div class="cell r-thick">thick border</div>
  <div class="cell r-sides">uneven sides</div>
  <div class="cell r-fill">background only</div>
</div>
</body>
</html>
