version: 2

builds:
  - main: ./cmd/litho
    binary: litho
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64
      - linux_arm64
      - linux_386
      - linux_arm_7
      - linux_ppc64le
      - linux_riscv64
      - linux_s390x
      - linux_loong64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - freebsd_arm64
      - windows_amd64
      - windows_arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# The release already exists: the workflow runs when it is published. Keep its
# title and notes, and only attach the archives.
release:
  mode: keep-existing
  extra_files:
    - glob: ./install.sh
