name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

# litho is pure Go: building without cgo catches any dependency that needs it.
env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint Golang codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linters
        run: make lint

      - name: Run unparam
        run: make lint-unparam

  lint-prettier:
    name: Lint non-Golang codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run linters
        run: make lint-prettier

  test-unit:
    needs:
      - lint
      - lint-prettier
    name: Run unit tests
    runs-on: ubuntu-latest
    # On Linux, -race requires cgo.
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test-unit

  # Gotenberg ships linux/386 and linux/arm/v7, where int is 32 bits. An amd64
  # runner executes 386 binaries natively; -race does not support 386. armv7
  # shares the 32-bit int, so vetting it catches what only ARM rejects.
  test-unit-32bit:
    needs:
      - lint
      - lint-prettier
    name: Run unit tests (32-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests on linux/386
        run: make test-unit-386

      - name: Vet linux/arm/v7
        run: GOOS=linux GOARCH=arm GOARM=7 go vet ./...

  # The corpus converts with a copy of the Gotenberg image's fonts, passed as
  # font directories. This job runs the same conversions inside the image
  # itself, with no directory, so litho must find the fonts by its own
  # discovery where Gotenberg runs it: one source per script the image has
  # fonts for, failing on a conversion error, on no font found, or on a
  # character reported missing.
  test-system-fonts:
    needs:
      - lint
      - lint-prettier
    name: Convert inside the Gotenberg image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the corpus command
        run: go build -o corpus ./test/integration/cmd/corpus

      - name: Pull the pinned Gotenberg image
        run: docker pull "$(sed -n 's/^GOTENBERG_IMAGE=//p' test/integration/corpus/versions.env)"

      - name: Convert with the image's fonts
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" -w /src \
            --entrypoint /src/corpus \
            "$(sed -n 's/^GOTENBERG_IMAGE=//p' test/integration/corpus/versions.env)" \
            system-fonts test/integration/cmd/corpus/testdata/system-fonts/*
