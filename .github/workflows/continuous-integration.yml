name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

# litho is pure Go: building without cgo catches any dependency that needs it.
env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint Golang codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linters
        run: make lint

      - name: Run unparam
        run: make lint-unparam

  lint-prettier:
    name: Lint non-Golang codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run linters
        run: make lint-prettier

  test-unit:
    needs:
      - lint
      - lint-prettier
    name: Run unit tests
    runs-on: ubuntu-latest
    # On Linux, -race requires cgo.
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test-unit

  # Gotenberg ships linux/386 and linux/arm/v7, where int is 32 bits. An amd64
  # runner executes 386 binaries natively; -race does not support 386. armv7
  # shares the 32-bit int, so vetting it catches what only ARM rejects.
  test-unit-32bit:
    needs:
      - lint
      - lint-prettier
    name: Run unit tests (32-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests on linux/386
        run: make test-unit-386

      - name: Vet linux/arm/v7
        run: GOOS=linux GOARCH=arm GOARM=7 go vet ./...

  snapshot:
    if: github.event_name == 'pull_request'
    needs:
      - test-unit
      - test-unit-32bit
    name: Snapshot release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
